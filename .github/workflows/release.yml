name: Release

# Builds Windows, macOS and Linux binaries and creates a draft release. Add the release
# description (it becomes the ReaPack changelog) and publish the draft - see reapack.yml.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check tag is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME points to a commit that is not on main"
            exit 1
          fi

      - id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

  build:
    needs: check
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.check.outputs.version }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir dist
          cp artifacts/windows-x64/reaper_drop_to_sampler-x64.dll dist/
          cp artifacts/macos-universal/reaper_drop_to_sampler.dylib dist/
          cp artifacts/linux-x86_64/reaper_drop_to_sampler-x86_64.so dist/
          cp artifacts/linux-aarch64/reaper_drop_to_sampler-aarch64.so dist/
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --draft \
              --title "$GITHUB_REF_NAME" \
              --notes ""
          fi
