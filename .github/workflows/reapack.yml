name: ReaPack

# Adds the published release to index.xml, using the release description as the changelog.
# Editing the description of a published release updates the changelog.

on:
  release:
    types: [published, edited]

permissions:
  contents: write

concurrency:
  group: reapack-index
  cancel-in-progress: false

env:
  WIN_ASSET: reaper_drop_to_sampler-x64.dll
  MAC_ASSET: reaper_drop_to_sampler.dylib
  LINUX_ASSET: reaper_drop_to_sampler-x86_64.so
  LINUX_ARM_ASSET: reaper_drop_to_sampler-aarch64.so

jobs:
  index:
    if: ${{ !github.event.release.draft && !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Update index.xml
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          NOTES: ${{ github.event.release.body }}
          AUTHOR: ${{ github.repository_owner }}
        run: |
          # Each platform is listed only if its file is attached to the release
          # (e.g. delete the .so files from the draft to ship without Linux)
          assets=$(gh release view "$TAG" --json assets --jq '.assets[].name')
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$TAG"
          sources=()
          if grep -qx "$WIN_ASSET" <<< "$assets"; then
            sources+=(--source win64 "$WIN_ASSET" "$url/$WIN_ASSET")
          fi
          if grep -qx "$MAC_ASSET" <<< "$assets"; then
            sources+=(--source darwin-arm64 "$MAC_ASSET" "$url/$MAC_ASSET")
            sources+=(--source darwin64 "$MAC_ASSET" "$url/$MAC_ASSET")
          fi
          if grep -qx "$LINUX_ASSET" <<< "$assets"; then
            sources+=(--source linux64 "$LINUX_ASSET" "$url/$LINUX_ASSET")
          fi
          if grep -qx "$LINUX_ARM_ASSET" <<< "$assets"; then
            sources+=(--source linux-aarch64 "$LINUX_ARM_ASSET" "$url/$LINUX_ARM_ASSET")
          fi
          if [ ${#sources[@]} -eq 0 ]; then
            echo "::error::Release $TAG has no plugin binaries"
            exit 1
          fi

          printf '%s' "$NOTES" > "$RUNNER_TEMP/changelog.md"
          python3 tools/reapack_index.py \
            --version "${TAG#v}" \
            --author "$AUTHOR" \
            --changelog-file "$RUNNER_TEMP/changelog.md" \
            "${sources[@]}"

      - name: Commit and push
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if git diff --quiet; then
            echo "index.xml unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git commit -am "ReaPack: $TAG"
          for attempt in 1 2 3; do
            git push origin HEAD:main && exit 0
            git pull --rebase origin main
          done
          exit 1
